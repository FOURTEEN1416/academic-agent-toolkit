name: Verify PaperSpine5 release assets

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.3.0-rc.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed release source and manifest
        run: python paperspine5/release_tools/verify_release.py
      - name: Download immutable public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.3.0-rc.1 --dir public-assets
      - name: Verify public package checksums
        working-directory: public-assets
        run: sha256sum --check checksums.sha256
