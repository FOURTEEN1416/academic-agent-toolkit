[pytest]
# 仓库根测试口径：收集 科研工具箱/tests（工具箱自有基线）+ 根级 tests/（catalog schema 硬校验、
# 反 AI 工具集检查两个独立门禁）。
# ⚠️ 基线唯一真源 = 2026-09-23 公开仓治理止血批实测：本机完整仓 **789 passed / 0 failed**；
#    工具箱内 **764 passed**、根级门禁 **25 passed**（764+25=789 自洽；另 3 skipped
#    = 私有资料区缺位语义 skip 2 + docx_template_fill pyc 缺陷钉住 1，collect-only 792）。
#    历史基线：2026-09-23 口径对齐轮 776 = 751 + 25（collect 779，续54 视觉审核批 780 / collect 783、
#    续55 editaplot-lite 批 +9 collect；止血批 CLAUDE.md 引用清零收口删 1 项在途豁免棘轮测试）；
#    2026-09-22 checkpoint 人类署名红线轮 772 = 747 + 25；同日 G2 申报/打包泛化轮 768 = 743 + 25；P4 资产激活轮 754 = 729 + 25；四批收编轮 717 = 696 + 21；华为杯轮 651 = 630 + 21；2026-09-20 宿主无关轮 639 = 620 + 19（该轮次日起 strict 机检实为 3F 未修,
#    2026-09-22 本轮修复转绿——secret_scan 自检 fixture 12 条豁免漏登 + LOG 续41 家目录路径 WARN）。
#    保留作历史：同日基线加固轮 628 = 609 + 19；2026-09-19 CI run 35425878920 = 600+3 skipped。
#    公开侧现行实测：2026-09-22 CI run 35711171875（@2c88d6c）= **713 passed + 5 skipped / 0 failed**；
#    收集总数与本机一致（718）。5 项 skip 逐条核过（-rs 输出）：test_asset_utilization 真仓机检 2、
#    私有资料区缺位（huawei_pipeline 缺参考论文）1、无 License 技能缺位（skill_routing 缺
#    plot-from-image）1、docx_template_fill pyc 缺陷钉住 1。均为语义 skip，非回归。
#    ⚠️ 该数字由 tools/project_health_check.py 的漂移检测守护——改测试数必须同步本文件与其余权威文档，
#    公开 clone / CI 口径以 CI 实测为准。
#    ⚠️ 升级首发实测 24 failed（导出的公开形态跑出），根因两类：①`.gitignore` 的整目录
#    规则 `科研工具箱/data/` 静默吞掉新增交付件（索引/经验库共 5 个，已改为逐项+放行）；
#    ②新增测试硬编码本机完整仓口径（`>=261` / `双向相等`），公开 clone 只有 256 技能。
#    修法：交付件入库 + 判据改环境无关（完备包含 / 公开口径下限），**不放宽校验强度**。
#    双口径差异：差 3 项为并行窗尚未提交的新测试；2 skipped 系 test_asset_utilization 的
#    "真仓机检"在缺 gitignored 私有资产时按语义 skip（理由随 -rs 输出）。
#    修复留痕：①首测 459+1 failed 根因是 venv 缺 pypdf（_page_check 缺库返回 SKIP，测试
#    断言 ERROR）——非代码缺陷，已补包并写入 CI 依赖；②CI 首轮 25 failed 根因是**发布物残缺**
#    （16 个 tools/*.pyc 分发件与 .env.example 被 ignore 误排除）与 runner 的 cp1252 编码，
#    均已修。历史文档中的 452/423/428/457/384/408 均为失效口径。
# ⚠️ 2026-09-19：公开基准集 benchmarks/ 已裁定废弃入库，其唯一依赖测试
#    tests/test_cumcm_benchmark.py 同步移除（内容与恢复方式见
#    dev-docs/archive/legacy-benchmarks-tests-20260919/README.md）。根级 tests/ 路径保留。
# releases/ 是 dated 发布快照（archive 态，仅供追溯），其内部旧测试依赖旧目录结构，
# 2026-09-03 起从收集范围排除——修复"仓库根 pytest 333 collection errors"（快照污染收集器）
# 科研工具箱自有 pytest.ini（testpaths=tests）对其目录内收集仍然生效：tools/test_workflow.py
# 是裸脚本式自检（硬编码 cwd=科研工具箱 的相对路径），从仓库根收集必断，一并排除
testpaths = 科研工具箱/tests tests
norecursedirs = releases .* build dist node_modules __pycache__ 科研工具箱/tools
