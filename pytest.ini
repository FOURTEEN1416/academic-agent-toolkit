#    守 Git pathspec '*' 跨 '/' 导致嵌套 modules 子技能虚计。
#    ⚠️ 该数字由 tools/project_health_check.py 的漂移检测守护——改测试数必须同步本文件与其余权威文档，
#    公开 clone / CI 口径以 CI 实测为准。
#    历史教训（全文见 CHANGELOG 与内部 LOG）：① .gitignore 整目录规则会静默吞新增 data/ 交付件，
#    须逐项放行；② 新增测试判据须环境无关（公开 clone 口径下限），不放宽校验强度；
#    ③ venv 缺包会以"工具 SKIP → 测试断言 ERROR"形式假红，先补依赖再取数。
# releases/ 是 dated 发布快照（archive 态，仅供追溯），其内部旧测试依赖旧目录结构，
# 从收集范围排除（快照会污染收集器）。
# academic-toolkit自有 pytest.ini（testpaths=tests）对其目录内收集仍然生效：tools/test_workflow.py
# 是裸脚本式自检（硬编码 cwd=academic-toolkit 的相对路径），从仓库根收集必断，一并排除
testpaths = academic-toolkit/tests
norecursedirs = releases .* build dist node_modules __pycache__ academic-toolkit/tools academic-toolkit/third_party
