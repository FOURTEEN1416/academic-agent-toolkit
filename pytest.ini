[pytest]
# 仓库根测试口径：收集 科研工具箱/tests（工具箱自有基线）+ 根级 tests/（catalog schema 硬校验、
# 反 AI 工具集检查两个独立门禁）。
# ⚠️ 基线唯一真源 = 2026-09-19 实测：**460 passed / 0 failed**（85.3s，junit 取证，0 error/0 skipped）。
#    修复留痕：首测 459 + 1 failed（test_quick_gates::test_page_check_bad_pdf_errors_without_raising），
#    根因是本仓 venv 缺 pypdf（_page_check 缺库时返回 SKIP，而测试断言 ERROR）——非代码缺陷；
#    已 `pip install pypdf` 并写入 CI 依赖，现全绿。历史文档中的 452/423/428/457/384/408 均为失效口径。
#    ⚠️ 双口径（2026-09-19 CI 上线后固化）：本机完整仓 = **460 passed**；公开 clone / CI =
#    **457 收集 = 455 passed + 2 skipped**（run 35410978808，29.4s）。差 3 项为并行窗未提交的
#    新测试；2 skipped 为 test_asset_utilization 的"真仓机检"在缺 gitignored 私有资产时
#    按语义 skip（理由随 -rs 输出）。CI 见 .github/workflows/ci.yml。
# ⚠️ 2026-09-19：公开基准集 benchmarks/ 已裁定废弃入库，其唯一依赖测试
#    tests/test_cumcm_benchmark.py 同步移除（内容与恢复方式见
#    dev-docs/archive/legacy-benchmarks-tests-20260919/README.md）。根级 tests/ 路径保留。
# releases/ 是 dated 发布快照（archive 态，仅供追溯），其内部旧测试依赖旧目录结构，
# 2026-09-03 起从收集范围排除——修复"仓库根 pytest 333 collection errors"（快照污染收集器）
# 科研工具箱自有 pytest.ini（testpaths=tests）对其目录内收集仍然生效：tools/test_workflow.py
# 是裸脚本式自检（硬编码 cwd=科研工具箱 的相对路径），从仓库根收集必断，一并排除
testpaths = 科研工具箱/tests tests
norecursedirs = releases .* build dist node_modules __pycache__ 科研工具箱/tools
