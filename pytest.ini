#    计数口径守卫：test_project_health_check::test_actual_skill_count_ignores_nested_bundled_skills
#    守 Git pathspec '*' 跨 '/' 导致嵌套 modules 子技能虚计。
#    ⚠️ 该数字由 tools/project_health_check.py 的漂移检测守护——改测试数必须同步本文件与其余权威文档，
