name: CI

# 最小可用集（2026-09-19 建立）：跑通即代表仓库基线未破。
# 口径唯一真源 = pytest.ini 注释；dev-docs/truth-index.md 为内部副本，不入库。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的旧运行自动取消，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限（2026-09-20 加固，GitHub Actions 安全基线）：本工作流只读仓内容，
# 无需写包/写 PR 等令牌面——默认令牌权限过大是供应链攻击的标准跳板。
permissions:
  contents: read

jobs:
  test:
    name: pytest + provenance + gates
    # 与开发环境一致（Windows + Python 3.11）：本仓库含中文路径与 NTFS 联结，
    # 在 Linux runner 上行为不可预测，故不用 ubuntu-latest。
    runs-on: windows-latest
    timeout-minutes: 25

    # 2026-09-19 首次 CI 实测发现：Windows runner 的 stdout 默认编码为 cp1252，
    # 子进程 print 中文会抛 UnicodeEncodeError（7 项测试因此失败）。强制 UTF-8。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip   # 2026-09-20：缓存 pip 依赖，缩短安装步

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install test dependencies
        # 单一真源 = requirements-dev.txt（2026-09-19 建立；此前本仓无任何依赖声明，
        # 缺 pypdf 即致 1 项测试失败——_page_check 缺库时返回 SKIP 而测试断言 ERROR）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install vendored CodeSucker backend
        # 14 项测试（source_materials_gate / codesucker_bridge / codesucker_materials /
        # copyright_codesucker_integration）依赖该 vendored TS loader；本机 node_modules
        # 常驻故从未暴露，CI 须显式安装（2026-09-19 首次 CI 实测发现）。
        working-directory: 科研工具箱/tools/codesucker-core
        run: npm ci

      - name: Repository-root test suite
        # CI 侧实测（2026-09-19 run 35410978808）：457 收集 = 455 passed + 2 skipped，0 failed，29.4s。
        # 与本地 460 的口径差异：公开 clone 比本机完整仓少 3 项（并行窗尚未提交的新测试），
        # 另有 2 项按语义 skip（test_asset_utilization 的"真仓机检"在缺 gitignored 私有
        # 资产时 skip，理由随 -rs 输出）。
        run: python -m pytest -q -rs

      - name: Provenance ledger
        # 期望：66/66 通过（UPSTREAM.md 台账 + vendor pinned commit）
        run: python 科研工具箱/tools/check_provenance.py

      - name: Secret & path hygiene scan
        # 2026-09-20 建立：tracked 面密钥/配置绝对路径扫描（吸收 gitleaks 的
        # "CI 纵深防御"思路，自建实现保持自包含）。豁免台账 3 条见
        # 科研工具箱/data/secret_scan_allowlist.json。
        run: python 科研工具箱/tools/secret_scan.py --strict

      - name: Lint ratchet
        # 2026-09-20 建立：ruff 基线棘轮（新增违规即拦；基线只降不升）。
        # ruff 版本由 requirements-dev.txt 锁死（==0.16.8），保证计数可比。
        run: python 科研工具箱/tools/lint_ratchet.py

      - name: Duplicate assets registry
        # 2026-09-20 建立：重复资产台账棘轮（未登记的字节级重复组即拦）。
        run: python 科研工具箱/tools/check_duplicate_assets.py --strict
